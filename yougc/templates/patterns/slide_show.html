{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'css/slide_show.css' %}">
<div class="slideshow-container">

    <!-- Full-width images with number and caption text -->
    {% for slide in slide_show.slides %}
    <div class="mySlides fade">
        <div class="numbertext">{{slide.index}} / {{slide_show.slides_count}}</div>
        <img src="/static/img/slide_show/{{slide_show.dirname}}/{{slide.img}}" class="slide-img">
        <div class="text">{{slide.text}}</div>
    </div>
    {% endfor %}
    <!-- Next and previous buttons -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>
</div>
<div style="text-align:center">
    {% for slide in slide_show.slides %}
    <span class="dot" onclick="currentSlide({{slide.index}})"></span>
    {% endfor %}
</div>
<script src="{% static 'scripts/slide_show.js' %}"></script>
